version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    IMAGE_REPO_NAME: brain-tasks-app
    EKS_CLUSTER_NAME: brain-tasks-cluster

phases:

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...

      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME

      - echo Repository URI: $REPOSITORY_URI

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG=latest; fi

      - echo Image tag: $IMAGE_TAG

  build:
    commands:
      - echo Building Docker image...

      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .

      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $REPOSITORY_URI:latest

      - echo Docker images:

      - docker images

  post_build:
    commands:
      - echo Pushing Docker images to ECR...

      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - docker push $REPOSITORY_URI:latest

      - echo Updating kubeconfig...

      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_DEFAULT_REGION

      - echo Replacing image URI in deployment.yaml...

      - sed -i "s|IMAGE_URI|$REPOSITORY_URI:$IMAGE_TAG|g" k8s/deployment.yaml

      - echo Applying Kubernetes manifests...

      - kubectl apply -f k8s/deployment.yaml

      - kubectl apply -f k8s/service.yaml

      - echo Waiting for deployment rollout...

      - kubectl rollout status deployment/brain-tasks-app

      - echo Deployment completed successfully!

artifacts:
  files:
    - k8s/deployment.yaml
    - k8s/service.yaml
    - buildspec.yml
